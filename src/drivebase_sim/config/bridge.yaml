# ros_gz_bridge topic mappings.
#
# Deliberately NOT bridged: the DiffDrive transform topic. robot_localization
# must be the sole publisher of odom -> base_footprint. See gazebo.xacro.
#
# gz_topic_name values are absolute gz transport paths. Model-scoped topics are
# under /model/<entity_name>/..., where the entity name comes from the `-name`
# argument given to `ros_gz_sim create` in sim.launch.py. If you rename the
# spawned entity, these must change too.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# TwistStamped, not Twist. Verified against Jazzy Nav2 1.3.12: nav2_velocity_smoother
# is TwistStamped-only, and controller_server publishes stamped. The bridge maps
# TwistStamped -> gz.msgs.Twist and drops the header, which is what DiffDrive wants.
#
# Consequence for manual testing: `ros2 topic pub /cmd_vel geometry_msgs/msg/Twist`
# will silently do nothing. Use TwistStamped, or teleop_twist_keyboard with
# -p stamped:=true.
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/drivebase/cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/model/drivebase/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/model/drivebase/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu/data"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/gps/fix"
  gz_topic_name: "/gps/fix"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

# Raw simulated cones. laserscan_to_range collapses each to sensor_msgs/Range,
# which is the interface the real HC-SR04 driver will publish directly.
- ros_topic_name: "/ultrasonic/front_left/scan"
  gz_topic_name: "/ultrasonic/front_left/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

