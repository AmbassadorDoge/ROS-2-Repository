# ros_gz_bridge topic mappings.
#
# Deliberately NOT bridged: the DiffDrive transform topic. robot_localization
# must be the sole publisher of odom -> base_footprint. See gazebo.xacro.
#
# gz_topic_name values are absolute gz transport paths. Model-scoped topics are
# under /model/<entity_name>/..., where the entity name comes from the `-name`
# argument given to `ros_gz_sim create` in sim.launch.py. If you rename the
# spawned entity, these must change too.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Twist, NOT TwistStamped.
#
# I originally set this to TwistStamped after finding that nav2_velocity_smoother's
# library is full of TwistStamped symbols. That was the wrong inference: the library
# supports both and picks via `enable_stamped_cmd_vel`, which defaults to false in
# Jazzy 1.3.12. Observed at runtime, Nav2's whole chain publishes plain Twist:
#
#   /cmd_vel_nav       geometry_msgs/msg/Twist
#   /cmd_vel_smoothed  geometry_msgs/msg/Twist
#   /cmd_vel           geometry_msgs/msg/Twist   <- collision_monitor output
#
# With TwistStamped here, /cmd_vel carried TWO types at once, the bridge received
# nothing, and the robot sat still while Nav2 happily published at 20 Hz. A type
# mismatch on a topic is silent - no error anywhere - so it is worth checking
# `ros2 topic info /cmd_vel` first whenever the robot ignores commands.
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/drivebase/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/model/drivebase/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/model/drivebase/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu/data"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# _raw: gps_covariance_shim republishes this onto /gps/fix with covariance
# filled in, because gz.msgs.NavSat carries none and robot_localization needs it.
- ros_topic_name: "/gps/fix_raw"
  gz_topic_name: "/gps/fix"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

# Raw simulated cones. laserscan_to_range collapses each to sensor_msgs/Range,
# which is the interface the real HC-SR04 driver will publish directly.
- ros_topic_name: "/ultrasonic/front_left/scan"
  gz_topic_name: "/ultrasonic/front_left/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/ultrasonic/front_midleft/scan"
  gz_topic_name: "/ultrasonic/front_midleft/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/ultrasonic/front_center/scan"
  gz_topic_name: "/ultrasonic/front_center/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/ultrasonic/front_midright/scan"
  gz_topic_name: "/ultrasonic/front_midright/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
