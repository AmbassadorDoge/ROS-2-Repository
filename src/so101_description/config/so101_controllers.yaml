# Controller configuration for the SO-101 arm.
#
# Loaded two different ways depending on the backend:
#   - bringup.launch.py passes this file to a standalone ros2_control_node.
#   - gazebo.launch.py has it loaded by the gz_ros2_control plugin *inside* the
#     Gazebo process (referenced from urdf/so101.ros2_control.xacro).
# Both paths use this same file, so a trajectory that works on mock hardware
# works unchanged in Gazebo.
#
# WHY THE JOINT NAMES ARE PREFIXED
#
# There is deliberately only one of these files, and it uses the "arm_" prefix
# because that is how the arm actually exists on the robot:
# drivebase.urdf.xacro instantiates `<xacro:so101 prefix="arm_" ...>`. A config
# with bare joint names would work standalone and then silently bind to nothing
# once the arm is on the chassis — the controller spawns, reports active, and
# no joint moves.
#
# So the standalone entry point (urdf/so101.urdf.xacro) also defaults to
# prefix:=arm_, keeping one config valid everywhere. If you change the prefix
# in either place, change it in all three: the so101 macro call, the
# so101_ros2_control macro call, and the joint list below.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    # All six joints, gripper included, live in one trajectory controller.
    # If the gripper later needs independent action-based control, move it out
    # into its own controller rather than adding a second one over these joints.
    joints:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    # Allows goals that name only a subset of joints (e.g. single-joint tests).
    allow_partial_joints_goal: true
